<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset-Manager</title>
<style>
:root { color-scheme: dark; }
body { font-family: system-ui, sans-serif; background: #14161a; color: #e8e8e8;
       margin: 0 auto; max-width: 900px; padding: 24px; }
h1 { font-size: 1.4rem; } h2 { font-size: 1.1rem; margin-top: 2em;
  border-bottom: 1px solid #333; padding-bottom: 4px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #2a2d33; }
input, select, button { background: #22262c; color: #e8e8e8;
  border: 1px solid #444; border-radius: 4px; padding: 6px 10px; }
button { cursor: pointer; } button:hover { background: #2c3138; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
pre { background: #0c0e11; padding: 12px; border-radius: 6px; overflow: auto; }
.muted { color: #999; }
.badge { display: inline-block; background: #24344d; border: 1px solid #3a5a8c; border-radius: 10px; padding: 1px 8px; font-size: 0.85em; }
</style>
</head>
<body>
<h1>Asset-Manager <span class="muted" id="ver"></span></h1>

<h2>Actions</h2>
<div class="row">
  <input id="scope" placeholder="scope filter (e.g. file)" size="24">
  <input id="runpath" placeholder="/path/to/target (optional)" size="34">
  <button onclick="loadActions()">Refresh</button>
</div>
<table><thead><tr><th>ID</th><th>Name</th><th>Type</th><th></th></tr></thead>
<tbody id="actions"></tbody></table>

<h2>Project</h2>
<div class="row">
  <input id="projdir" placeholder="/path/to/new/project" size="34">
  <input id="projname" placeholder="name" size="16">
  <button onclick="initProject()">Init project</button>
</div>

<h2>Project browser</h2>
<div class="row">
  <input id="scanpath" placeholder="/path/to/godot/project" size="34">
  <button onclick="scanProject()">Scan</button>
</div>
<table><thead><tr><th>Path</th><th>Size</th><th>Import</th><th>Details</th><th>Preview</th></tr></thead>
<tbody id="scanrows"><tr><td colspan="5" class="muted">No scan yet.</td></tr></tbody></table>

<h2>Library</h2>
<div class="row">
  <input id="libserver" placeholder="http://library:8081" size="26">
  <input id="libtoken" placeholder="token" size="20" type="password">
  <input id="libquery" placeholder="search..." size="20">
  <button onclick="searchLibrary()">Search</button>
</div>
<table><thead><tr><th></th><th>ID</th><th>Name</th><th>Kind</th><th>Size</th><th>Tags</th></tr></thead>
<tbody id="librows"><tr><td colspan="6" class="muted">Not connected.</td></tr></tbody></table>

<h2>Status</h2>
<div class="row">
  <input id="statuspath" placeholder="/path/to/project" size="34">
  <button onclick="showStatus()">Status</button>
</div>
<pre id="out">Ready.</pre>

<script>
async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json();
  if (!r.ok && !body.error && body.exit_code === undefined) throw body;
  return {status: r.status, body};
}
function say(obj) { document.getElementById('out').textContent =
  typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2); }

async function loadActions() {
  const scope = document.getElementById('scope').value;
  const {body} = await api('/api/actions?scope=' + encodeURIComponent(scope));
  const tb = document.getElementById('actions');
  tb.innerHTML = '';
  for (const a of body.actions) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td><td></td><td></td>';
    tr.children[0].textContent = a.id;
    tr.children[1].textContent = a.name;
    tr.children[2].textContent = a.type;
    const btn = document.createElement('button');
    btn.textContent = 'Run';
    btn.onclick = () => runAction(a.id);
    tr.children[3].appendChild(btn);
    tb.appendChild(tr);
  }
  if (body.errors && body.errors.length) say({warning: body.errors});
}
async function runAction(id) {
  const path = document.getElementById('runpath').value;
  const {status, body} = await api('/api/run', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action_id: id, path})});
  say({http: status, ...body});
}
async function initProject() {
  const directory = document.getElementById('projdir').value;
  const name = document.getElementById('projname').value;
  const {body} = await api('/api/project-init', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({directory, name})});
  say(body);
}
async function showStatus() {
  const path = document.getElementById('statuspath').value;
  const {status, body} = await api('/api/status?path=' + encodeURIComponent(path));
  say({http: status, ...body});
}
async function scanProject() {
  const path = document.getElementById('scanpath').value;
  const {status, body} = await api('/api/scan?path=' + encodeURIComponent(path));
  if (status !== 200) { say({http: status, ...body}); return; }
  const tb = document.getElementById('scanrows');
  tb.innerHTML = '';
  for (const a of body.assets) {
    const tr = document.createElement('tr');
    const pathTd = document.createElement('td');
    pathTd.textContent = a.path;
    const sizeTd = document.createElement('td');
    sizeTd.textContent = fmtSize(a.size_bytes);
    sizeTd.style.whiteSpace = 'nowrap';
    const impTd = document.createElement('td');
    if (a.has_import && a.import && a.import.importer) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = a.import.importer;
      impTd.appendChild(badge);
    } else {
      impTd.innerHTML = '<span class="muted">raw</span>';
    }
    const detTd = document.createElement('td');
    detTd.textContent = detailText(a);
    detTd.title = JSON.stringify({uid: a.uid, params: a.import && a.import.params,
      attributes: a.attributes}, null, 2);
    const thumbTd = document.createElement('td');
    const thumbBtn = document.createElement('button');
    thumbBtn.textContent = 'Show';
    thumbBtn.onclick = () => showThumb(body.root, a.path, thumbTd, thumbBtn);
    thumbTd.appendChild(thumbBtn);
    tr.append(pathTd, sizeTd, impTd, detTd, thumbTd);
    tb.appendChild(tr);
  }
  if (!body.assets.length) {
    tb.innerHTML = '<tr><td colspan="5" class="muted">No assets found.</td></tr>';
  }
  say({project: body.project_name, root: body.root, assets: body.assets.length});
}
async function showThumb(root, resPath, cell, btn) {
  btn.disabled = true;
  const abs = root + '/' + resPath.replace(/^res:\/\//, '');
  try {
    const r = await fetch('/api/thumbnail', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({source: abs})});
    if (!r.ok) { say({http: r.status, ...(await r.json().catch(() => ({})))}); return; }
    const img = document.createElement('img');
    img.style.maxWidth = '128px';
    img.src = URL.createObjectURL(await r.blob());
    cell.replaceChildren(img);
  } finally {
    btn.disabled = false;
  }
}
function libBase() {
  return document.getElementById('libserver').value.replace(/\/+$/, '');
}
function libHeaders() {
  return {'Authorization':
    'Bearer ' + document.getElementById('libtoken').value};
}
async function searchLibrary() {
  const q = document.getElementById('libquery').value;
  const tb = document.getElementById('librows');
  tb.innerHTML = '';
  let r;
  try {
    r = await fetch(libBase() + '/api/v1/assets' +
      (q ? '?q=' + encodeURIComponent(q) : ''), {headers: libHeaders()});
  } catch (e) {
    tb.innerHTML = '<tr><td colspan="6" class="muted">Cannot reach library ' +
      '(check server URL; the library allows cross-origin requests, ' +
      'but https UI pages cannot fetch plain-http servers).</td></tr>';
    return;
  }
  if (!r.ok) {
    say({http: r.status, ...(await r.json().catch(() => ({})))});
    tb.innerHTML = '<tr><td colspan="6" class="muted">Request failed.</td></tr>';
    return;
  }
  const body = await r.json();
  for (const a of body.assets) {
    const tr = document.createElement('tr');
    const thumbTd = document.createElement('td');
    if (a.thumbnail_sha256) {
      loadLibThumb(a.id, thumbTd);
    } else {
      thumbTd.innerHTML = '<span class="muted">—</span>';
    }
    const idTd = document.createElement('td');
    idTd.textContent = a.id;
    const nameTd = document.createElement('td');
    nameTd.textContent = a.name;
    const kindTd = document.createElement('td');
    kindTd.textContent = a.kind;
    const sizeTd = document.createElement('td');
    sizeTd.textContent = fmtSize(a.size_bytes);
    sizeTd.style.whiteSpace = 'nowrap';
    const tagsTd = document.createElement('td');
    tagsTd.textContent = (a.tags || []).join(', ');
    tr.append(thumbTd, idTd, nameTd, kindTd, sizeTd, tagsTd);
    tb.appendChild(tr);
  }
  if (!body.assets.length) {
    tb.innerHTML = '<tr><td colspan="6" class="muted">No assets found.</td></tr>';
  }
  say({library: libBase(), assets: body.assets.length});
}
async function loadLibThumb(id, cell) {
  try {
    const r = await fetch(libBase() + '/api/v1/assets/' + id + '/thumbnail',
      {headers: libHeaders()});
    if (!r.ok) return;
    const img = document.createElement('img');
    img.style.maxWidth = '96px';
    img.loading = 'lazy';
    img.src = URL.createObjectURL(await r.blob());
    cell.replaceChildren(img);
  } catch (e) { /* leave the cell empty */ }
}
function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function detailText(a) {
  const bits = [];
  if (a.import && a.import.type) bits.push(a.import.type);
  if (a.import && a.import.params) bits.push(Object.keys(a.import.params).length + ' param(s)');
  if (a.uid) bits.push(a.uid);
  const keys = a.attributes ? Object.keys(a.attributes) : [];
  if (keys.length) bits.push('meta: ' + keys.join(', '));
  return bits.join(' · ') || '—';
}
fetch('/api/info').then(r => r.json()).then(i => {
  document.getElementById('ver').textContent = 'v' + i.version + ' · ' + i.mode;
}).catch(() => {});
loadActions();
</script>
</body>
</html>
