[project]
name = "asset-manager"
version = "0.2.0"
description = "OSS asset manager: action-plugin host, git-first version control, Python automation API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [ "pyyaml>=6" ]

[project.optional-dependencies]
test = [ "pytest>=8" ]

[project.scripts]
assetmgr = "assetmgr.cli:main"

[build-system]
requires = [ "setuptools>=68" ]

[tool.setuptools.packages.find]
include = [ "assetmgr*", "anchorpoint*", "apsync*" ]
